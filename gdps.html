<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Servidor Privado de Geometry Dash</title>
</head>
<body>
    <h1>¡Bienvenido a mi GDPS!</h1>

    <!-- Cambia la URL de la imagen por la tuya -->
    <img src="https://i.imgur.com/ejemplo.png" alt="Logo GDPS" width="200">

    <p>Descarga la APK o regístrate en nuestro servidor.</p>

    <p>
        <a href="AQUÍ_TU_ENLACE_DE_LA_APK">Descargar APK</a> |
        <a href="AQUÍ_TU_ENLACE_DE_INVITACION_A_DISCORD">Unirse al Discord</a>
    </p>

    <!-- Vídeo de YouTube -->
    <br>
    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/m-NnR_yFTF0?autoplay=1&mute=0" 
        title="Vídeo GDPS" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>

    <h2>Más información</h2>
    <div id="contenido-extra">Cargando información...</div>

    <script>
        // Cambia esta URL por la URL Raw de tu archivo en GitHub
        // Ejemplo: https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/info.txt
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/info.txt";

        async function cargarMasInformacion() {
            const contenedor = document.getElementById("contenido-extra");

            try {
                const respuesta = await fetch(GITHUB_RAW_URL);
                if (!respuesta.ok) {
                    throw new Error("No se pudo cargar el archivo");
                }
                const texto = await respuesta.text();
                contenedor.textContent = texto.trim() || "(El archivo está vacío)";
            } catch (error) {
                contenedor.textContent = "Error al cargar la información. Revisa la URL de GitHub.";
            }
        }

        // Se carga automáticamente al abrir la página
        cargarMasInformacion();
    </script>
</body>
</html>
